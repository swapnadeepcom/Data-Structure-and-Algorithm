name: Organize LeetCode Solutions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install markdownify beautifulsoup4

      - name: Organize problems and generate clean README
        shell: bash
        run: |
          python3 <<'PYTHON_SCRIPT'
          import json
          import re
          import shutil
          import urllib.request
          from pathlib import Path

          from bs4 import BeautifulSoup
          from markdownify import markdownify as html_to_markdown


          ROOT = Path(".")


          TOPIC_MAPPING = {
              "array": "Array",
              "string": "String",
              "hash table": "Hash-Table",
              "linked list": "Linked-List",
              "stack": "Stack",
              "queue": "Queue",
              "tree": "Tree",
              "binary tree": "Tree",
              "binary search tree": "Tree",
              "graph": "Graph",
              "depth-first search": "Graph",
              "breadth-first search": "Graph",
              "heap (priority queue)": "Heap",
              "heap": "Heap",
              "binary search": "Binary-Search",
              "two pointers": "Two-Pointers",
              "sliding window": "Sliding-Window",
              "dynamic programming": "Dynamic-Programming",
              "backtracking": "Backtracking",
              "greedy": "Greedy",
              "matrix": "Matrix",
              "prefix sum": "Prefix-Sum",
              "sorting": "Sorting",
              "bit manipulation": "Bit-Manipulation",
              "trie": "Trie",
              "union find": "Disjoint-Set",
              "divide and conquer": "Divide-and-Conquer",
              "recursion": "Recursion",
              "math": "Math",
              "simulation": "Simulation",
              "design": "Design",
          }


          # Broad DSA categories are preferred.
          # Running Sum therefore goes into Array rather than Prefix-Sum.
          TOPIC_PRIORITY = [
              "Linked-List",
              "Tree",
              "Graph",
              "Array",
              "String",
              "Stack",
              "Queue",
              "Heap",
              "Trie",
              "Dynamic-Programming",
              "Backtracking",
              "Greedy",
              "Binary-Search",
              "Two-Pointers",
              "Sliding-Window",
              "Matrix",
              "Hash-Table",
              "Disjoint-Set",
              "Prefix-Sum",
              "Sorting",
              "Bit-Manipulation",
              "Divide-and-Conquer",
              "Recursion",
              "Math",
              "Simulation",
              "Design",
          ]


          TOPIC_DIRECTORIES = set(TOPIC_MAPPING.values())
          TOPIC_DIRECTORIES.add("Other")


          def is_problem_folder(path: Path) -> bool:
              return path.is_dir() and bool(re.match(r"^\d+-", path.name))


          def problem_slug(folder_name: str) -> str:
              return re.sub(r"^\d+-", "", folder_name)


          def fetch_problem(slug: str):
              query = """
              query questionData($titleSlug: String!) {
                question(titleSlug: $titleSlug) {
                  questionFrontendId
                  title
                  titleSlug
                  content
                  difficulty
                  topicTags {
                    name
                    slug
                  }
                }
              }
              """

              payload = {
                  "query": query,
                  "variables": {
                      "titleSlug": slug
                  }
              }

              request = urllib.request.Request(
                  "https://leetcode.com/graphql",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "Referer": f"https://leetcode.com/problems/{slug}/",
                      "User-Agent": "Mozilla/5.0",
                  },
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:
                      result = json.loads(
                          response.read().decode("utf-8")
                      )

                  return result.get("data", {}).get("question")

              except Exception as error:
                  print(
                      f"Could not download metadata for {slug}: "
                      f"{error}"
                  )
                  return None


          def select_topic(problem) -> str:
              if not problem:
                  return "Other"

              detected = []

              for tag in problem.get("topicTags", []):
                  tag_name = tag.get("name", "").strip().lower()
                  mapped = TOPIC_MAPPING.get(tag_name)

                  if mapped:
                      detected.append(mapped)

              for preferred in TOPIC_PRIORITY:
                  if preferred in detected:
                      return preferred

              return "Other"


          def clean_problem_html(raw_html: str) -> str:
              if not raw_html:
                  return "Problem description is currently unavailable."

              soup = BeautifulSoup(raw_html, "html.parser")

              # Remove unnecessary attributes that can disturb Markdown.
              for element in soup.find_all(True):
                  element.attrs = {}

              cleaned_html = str(soup)

              markdown = html_to_markdown(
                  cleaned_html,
                  heading_style="ATX",
                  bullets="-",
                  strip=["script", "style"],
              )

              # Remove excessive blank lines.
              markdown = re.sub(r"\n{3,}", "\n\n", markdown)

              # Remove trailing spaces from every line.
              markdown = "\n".join(
                  line.rstrip()
                  for line in markdown.splitlines()
              )

              return markdown.strip()


          def find_solution_file(folder: Path):
              allowed_extensions = {
                  ".py",
                  ".java",
                  ".cpp",
                  ".c",
                  ".cs",
                  ".js",
                  ".ts",
                  ".go",
                  ".rs",
                  ".kt",
                  ".swift",
                  ".rb",
                  ".php",
                  ".scala",
              }

              for file in folder.iterdir():
                  if (
                      file.is_file()
                      and file.suffix.lower() in allowed_extensions
                  ):
                      return file

              return None


          def language_from_extension(extension: str) -> str:
              languages = {
                  ".py": "python",
                  ".java": "java",
                  ".cpp": "cpp",
                  ".c": "c",
                  ".cs": "csharp",
                  ".js": "javascript",
                  ".ts": "typescript",
                  ".go": "go",
                  ".rs": "rust",
                  ".kt": "kotlin",
                  ".swift": "swift",
                  ".rb": "ruby",
                  ".php": "php",
                  ".scala": "scala",
              }

              return languages.get(extension.lower(), "")


          def extract_existing_section(
              readme_path: Path,
              heading: str
          ):
              if not readme_path.exists():
                  return None

              content = readme_path.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              pattern = re.compile(
                  rf"##\s+{re.escape(heading)}\s*\n"
                  rf"(.*?)(?=\n##\s+|\Z)",
                  re.IGNORECASE | re.DOTALL,
              )

              match = pattern.search(content)

              if not match:
                  return None

              section = match.group(1).strip()

              bad_values = [
                  "write the approach",
                  "write the first step",
                  "o(?)",
                  "complete this section",
              ]

              if not section:
                  return None

              if any(value in section.lower() for value in bad_values):
                  return None

              return section


          def default_analysis(problem_title: str, solution_file: Path):
              """
              Adds a useful analysis only for patterns that can be
              recognized safely. Other problems receive a clear note
              instead of incorrect complexity information.
              """

              title = problem_title.lower()

              code = ""

              if solution_file and solution_file.exists():
                  code = solution_file.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )

              if "running sum of 1d array" in title:
                  approach = (
                      "Use the **prefix-sum technique**.\n\n"
                      "Start from index `1`. Add the previous running "
                      "sum to the current element. After each update, "
                      "`nums[i]` contains the sum of all elements from "
                      "index `0` through index `i`.\n\n"
                      "The input array is updated directly, so an "
                      "additional result array is not required."
                  )

                  steps = (
                      "1. Start iterating from index `1`.\n"
                      "2. Add `nums[i - 1]` to `nums[i]`.\n"
                      "3. Repeat until the final element.\n"
                      "4. Return the updated array."
                  )

                  complexity = (
                      "- **Time Complexity:** `O(n)` because every "
                      "array element is processed once.\n"
                      "- **Space Complexity:** `O(1)` because the "
                      "input array is updated in place."
                  )

                  return approach, steps, complexity

              # A safe fallback. Do not invent complexity.
              approach = (
                  "The accepted solution is available below. Add a "
                  "short explanation of the technique used in the code."
              )

              steps = (
                  "Review the accepted solution and describe its main "
                  "processing steps."
              )

              complexity = (
                  "- **Time Complexity:** Add after analysing the loops "
                  "and operations used by the solution.\n"
                  "- **Space Complexity:** Add after checking the extra "
                  "data structures used by the solution."
              )

              return approach, steps, complexity


          def merge_folder(source: Path, destination: Path):
              destination.mkdir(parents=True, exist_ok=True)

              for item in source.iterdir():
                  target = destination / item.name

                  # The workflow will generate a new clean README.
                  if item.name.lower() in {
                      "readme.md",
                      "readme_en.md",
                  }:
                      continue

                  if item.is_dir():
                      if target.exists():
                          shutil.rmtree(target)

                      shutil.copytree(item, target)

                  else:
                      shutil.copy2(item, target)

              if source.resolve() != destination.resolve():
                  shutil.rmtree(source)


          def create_readme(
              destination: Path,
              folder_name: str,
              slug: str,
              problem
          ):
              number = folder_name.split("-", 1)[0]

              if problem:
                  title = problem.get("title") or (
                      slug.replace("-", " ").title()
                  )

                  frontend_id = (
                      problem.get("questionFrontendId")
                      or number
                  )

                  difficulty = problem.get(
                      "difficulty",
                      "Unknown"
                  )

                  tags = [
                      tag.get("name")
                      for tag in problem.get("topicTags", [])
                      if tag.get("name")
                  ]

                  description = clean_problem_html(
                      problem.get("content", "")
                  )

              else:
                  title = slug.replace("-", " ").title()
                  frontend_id = number
                  difficulty = "Unknown"
                  tags = []
                  description = (
                      "Problem description could not be downloaded."
                  )

              solution_file = find_solution_file(destination)

              old_readme = destination / "README.md"

              existing_approach = extract_existing_section(
                  old_readme,
                  "Approach"
              )

              existing_steps = extract_existing_section(
                  old_readme,
                  "Algorithm"
              )

              existing_complexity = extract_existing_section(
                  old_readme,
                  "Complexity Analysis"
              )

              generated_approach, generated_steps, generated_complexity = (
                  default_analysis(title, solution_file)
              )

              approach = (
                  existing_approach
                  or generated_approach
              )

              steps = (
                  existing_steps
                  or generated_steps
              )

              complexity = (
                  existing_complexity
                  or generated_complexity
              )

              tag_badges = " ".join(
                  f"`{tag}`"
                  for tag in tags
              ) or "`Not available`"

              solution_section = (
                  "The accepted solution file was not found."
              )

              if solution_file:
                  language = language_from_extension(
                      solution_file.suffix
                  )

                  code = solution_file.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  ).strip()

                  solution_section = (
                      f"### `{solution_file.name}`\n\n"
                      f"```{language}\n"
                      f"{code}\n"
                      f"```"
                  )

              readme = f"""# {frontend_id}. {title}

          | Difficulty | Topics |
          |---|---|
          | **{difficulty}** | {tag_badges} |

          [View problem on LeetCode](https://leetcode.com/problems/{slug}/)

          ---

          ## Problem Description

          {description}

          ---

          ## Approach

          {approach}

          ---

          ## Algorithm

          {steps}

          ---

          ## Complexity Analysis

          {complexity}

          ---

          ## Solution

          {solution_section}
          """

              # Critical fix: remove all unwanted indentation.
              lines = readme.splitlines()

              cleaned = []

              for line in lines:
                  if line.startswith("          "):
                      line = line[10:]

                  cleaned.append(line.rstrip())

              final_content = "\n".join(cleaned).strip() + "\n"

              old_readme.write_text(
                  final_content,
                  encoding="utf-8"
              )


          # Find new problems in root.
          candidates = []

          for item in ROOT.iterdir():
              if is_problem_folder(item):
                  candidates.append(item)


          # Also rebuild README files already inside topic folders.
          for topic_directory in TOPIC_DIRECTORIES:
              topic_path = ROOT / topic_directory

              if not topic_path.exists():
                  continue

              for item in topic_path.iterdir():
                  if is_problem_folder(item):
                      candidates.append(item)


          # Remove duplicates while preserving order.
          unique_candidates = []
          seen_paths = set()

          for candidate in candidates:
              resolved = candidate.resolve()

              if resolved not in seen_paths:
                  unique_candidates.append(candidate)
                  seen_paths.add(resolved)


          for source in unique_candidates:
              folder_name = source.name
              slug = problem_slug(folder_name)

              print(f"Processing {folder_name}")

              problem = fetch_problem(slug)
              topic = select_topic(problem)

              destination = ROOT / topic / folder_name

              if source.resolve() != destination.resolve():
                  merge_folder(source, destination)
              else:
                  destination.mkdir(
                      parents=True,
                      exist_ok=True
                  )

              create_readme(
                  destination,
                  folder_name,
                  slug,
                  problem
              )

              print(f"Created clean README: {destination}")


          # Remove empty Other folder.
          other_folder = ROOT / "Other"

          if other_folder.exists():
              try:
                  other_folder.rmdir()
              except OSError:
                  pass

          PYTHON_SCRIPT

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add --all

          if git diff --cached --quiet; then
            echo "No changes required."
          else
            git commit -m "Improve LeetCode README formatting"
            git push
          fi
