name: Organize LeetCode Solutions

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  organize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Organize problem folders
        shell: bash
        run: |
          mkdir -p Array String Hash-Table Math \
            Binary-Search Two-Pointers Sliding-Window \
            Stack Queue Linked-List Tree Graph \
            Heap Greedy Backtracking Dynamic-Programming \
            Bit-Manipulation Matrix Other

          for dir in */; do
            folder="${dir%/}"

            # Ignore our topic folders and hidden/configuration folders
            case "$folder" in
              Array|String|Hash-Table|Math|Binary-Search|Two-Pointers|Sliding-Window|Stack|Queue|Linked-List|Tree|Graph|Heap|Greedy|Backtracking|Dynamic-Programming|Bit-Manipulation|Matrix|Other)
                continue
                ;;
            esac

            readme=""

            if [ -f "$folder/README.md" ]; then
              readme="$folder/README.md"
            elif [ -f "$folder/README_EN.md" ]; then
              readme="$folder/README_EN.md"
            fi

            topic="Other"

            if [ -n "$readme" ]; then
              content=$(tr '[:upper:]' '[:lower:]' < "$readme")

              if echo "$content" | grep -q "dynamic programming"; then
                topic="Dynamic-Programming"
              elif echo "$content" | grep -q "linked list"; then
                topic="Linked-List"
              elif echo "$content" | grep -q "binary search"; then
                topic="Binary-Search"
              elif echo "$content" | grep -q "sliding window"; then
                topic="Sliding-Window"
              elif echo "$content" | grep -q "two pointers"; then
                topic="Two-Pointers"
              elif echo "$content" | grep -q "backtracking"; then
                topic="Backtracking"
              elif echo "$content" | grep -q "bit manipulation"; then
                topic="Bit-Manipulation"
              elif echo "$content" | grep -q "hash table"; then
                topic="Hash-Table"
              elif echo "$content" | grep -q "matrix"; then
                topic="Matrix"
              elif echo "$content" | grep -q "graph"; then
                topic="Graph"
              elif echo "$content" | grep -q "tree"; then
                topic="Tree"
              elif echo "$content" | grep -q "heap"; then
                topic="Heap"
              elif echo "$content" | grep -q "stack"; then
                topic="Stack"
              elif echo "$content" | grep -q "queue"; then
                topic="Queue"
              elif echo "$content" | grep -q "greedy"; then
                topic="Greedy"
              elif echo "$content" | grep -q "string"; then
                topic="String"
              elif echo "$content" | grep -q "array"; then
                topic="Array"
              elif echo "$content" | grep -q "math"; then
                topic="Math"
              fi
            fi

            echo "Moving $folder to $topic/"
            mv "$folder" "$topic/"
          done

      - name: Commit organized folders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No files require organization."
          else
            git commit -m "Organize LeetCode solutions by topic"
            git push
          fi
